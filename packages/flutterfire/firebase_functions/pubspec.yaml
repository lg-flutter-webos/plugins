name: firebase_functions_webos
description: A webOS implementation of the Firebase Functions plugin.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  cloud_functions_platform_interface: any
  plugin_platform_interface: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^17.0.0

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: FirebaseFunctionsWebos
        pluginClass: FirebaseFunctionsWebosPlugin
