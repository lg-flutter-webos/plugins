name: flutter_keyboard_visibility_webos
description: Flutter plugin for discovering the state of the soft-keyboard visibility on webOS.
version: 1.0.0

environment:
  sdk: '>=2.12.0 <4.0.0'
  flutter: '>=1.20.0'

dependencies:
  meta: '>=1.0.0 <2.0.0'
  flutter_keyboard_visibility_platform_interface: ^2.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.1.7
  mockito: ^5.0.17
  flutter_lints: ^5.0.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: FlutterKeyboardVisibilityPluginWebOS
