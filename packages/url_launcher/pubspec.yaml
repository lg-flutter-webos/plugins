name: url_launcher_webos
description: webOS implementation of the url_launcher plugin. 
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      webos:
        dartPluginClass: UrlLauncherWebOSPlugin
