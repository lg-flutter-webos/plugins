name: webos_image_texture
description: A Flutter widget for displaying images on webOS using GPU texture rendering, with support for animated formats.
version: 1.0.0

environment:
  sdk: '>=2.19.4 <4.0.0'
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      webos:
        pluginClass: ImageTexturePlugin
