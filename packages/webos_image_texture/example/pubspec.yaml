name: webos_image_texture_example
description: Demonstrates how to use the image_texture plugin.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webos_image_texture:
    path: ../
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
     - assets/ETCMipMap.ktx
     - assets/ball.pkm
     - assets/test3_linear_ldr.astc
