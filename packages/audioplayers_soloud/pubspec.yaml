name: audioplayers_soloud
description: WebOS implementation of the audioplayers plugin based on flutter_soloud 3.1.10
version: 1.0.0

flutter:
  plugin:
    platforms:
      webos:
        pluginClass: AudioplayersSoloudPlugin

dependencies:
  audioplayers_platform_interface: ^7.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

environment:
  flutter: '>=3.3.0'
  sdk: '>=2.18.0 <4.0.0'
