name: sqflite_webos
description: SQLite plugin for Flutter. This plugin provides the webOS implementation for SQLite.
version: 1.0.0

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

flutter:
  plugin:
    platforms:
      webos:
        pluginClass: SqflitePlugin
        dartPluginClass: SqfliteWebOS

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0
  sqflite_platform_interface: ^2.4.0

dev_dependencies:
  flutter_lints: ^5.0.0
