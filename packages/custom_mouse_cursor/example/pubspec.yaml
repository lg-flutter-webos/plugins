name: custom_mouse_cursor_example
description: Demonstrates use of the custom_mouse_cursor package.
publish_to: 'none'

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  custom_mouse_cursor:
    path: ../

  cupertino_icons: ^1.0.2
  signature: ^5.3.0
  material_symbols_icons: ^4.39.3
  google_fonts: ^4.0.3
  chalkdart: ^3.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/cursors/
